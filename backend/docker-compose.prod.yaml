services:
  backend:
    build: .
    ports:
      # Host 8000 was already occupied by an unrelated pre-existing service on
      # this machine (a separate "AIC 2026" project's native process) — Docker
      # Desktop's WSL2 port-forwarding proxy still bound "successfully" and
      # container-internal requests worked fine, but host-side curl/browser
      # traffic to localhost:8000 got silently answered by that OTHER service
      # instead of this container. Moved to 8001 on the host side only; the
      # container's own internal port (uvicorn --port 8000) is untouched.
      - "8001:8000"
    env_file:
      - ../.env
    environment:
      # Keep the database on the volume below. The default
      # (sqlite:///./autograding.db, app/core/config.py) writes into the
      # container's own filesystem, so every `docker compose up --build` would
      # start from an empty job history.
      DATABASE_URL: sqlite:////app/var/autograding.db
    volumes:
      # var/ holds uploaded archives, per-job working dirs, cropped answer
      # regions and graded output — all of it referenced by URL from the UI
      # long after the run finishes, so it has to outlive the container.
      - backend_var:/app/var
    restart: unless-stopped

volumes:
  backend_var:
